name: Build RouxCord bundle

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

concurrency:
  group: roux-build-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://codeberg.org/raincord/rain.git
  UPSTREAM_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar con upstream (Codeberg)
        id: upstream
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Solo las ejecuciones programadas consultan el upstream.
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "Ejecución '$EVENT_NAME': se compila sin consultar el upstream."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Archivos con modificaciones de rebranding: si upstream los toca y hay conflicto, gana nuestra versión.
          PROTECTED_PATHS=(
            "src/rain/pages/Updater/index.tsx"
            "src/index.ts"
            "src/global.d.ts"
            "src/lib/index.ts"
            "src/rain/i18n/index.ts"
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH"

          # Sin ancestro común no se puede fusionar de forma segura (historiales sin relación).
          if ! BASE="$(git merge-base HEAD "upstream/$UPSTREAM_BRANCH" 2>/dev/null)"; then
            echo "::error::Este repositorio no comparte historial con $UPSTREAM_URL. Ejecuta UNA VEZ en local: git remote add upstream $UPSTREAM_URL && git fetch upstream && git merge -s ours --allow-unrelated-histories -m 'Enlazar historial con upstream' upstream/$UPSTREAM_BRANCH && git push origin $TARGET_BRANCH"
            exit 1
          fi

          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "El upstream no tiene commits nuevos. No hay nada que compilar."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Commits nuevos en upstream:"
          git log --oneline "HEAD..upstream/$UPSTREAM_BRANCH" | head -20

          # Aviso si upstream modificó archivos de rebranding (conviene revisarlos a mano).
          TOUCHED="$(git diff --name-only "$BASE" "upstream/$UPSTREAM_BRANCH" -- "${PROTECTED_PATHS[@]}" || true)"
          if [ -n "$TOUCHED" ]; then
            echo "::warning::Upstream modificó archivos de rebranding (en conflicto se conserva nuestra versión): $(echo "$TOUCHED" | tr '\n' ' ')"
          fi

          if git merge --no-edit -X ours "upstream/$UPSTREAM_BRANCH"; then
            echo "Fusión limpia."
          else
            echo "Quedan conflictos que -X ours no resuelve; se intentan resolver en los archivos protegidos."
            UNRESOLVED=()
            while IFS= read -r FILE; do
              [ -z "$FILE" ] && continue
              IS_PROTECTED=0
              for P in "${PROTECTED_PATHS[@]}"; do
                if [ "$FILE" = "$P" ]; then IS_PROTECTED=1; fi
              done

              if [ "$IS_PROTECTED" -eq 1 ]; then
                if git checkout --ours -- "$FILE" 2>/dev/null; then
                  git add -- "$FILE"
                else
                  git rm -q -- "$FILE"
                fi
              else
                UNRESOLVED+=("$FILE")
              fi
            done < <(git diff --name-only --diff-filter=U)

            if [ "${#UNRESOLVED[@]}" -gt 0 ]; then
              git merge --abort || true
              echo "::error::Conflictos fuera de los archivos de rebranding: ${UNRESOLVED[*]}. Resuélvelos manualmente en local y haz push."
              exit 1
            fi

            git commit --no-edit
          fi

          # Se publica la fusión para que el fork quede al día y no se recompile en cada cron.
          git push origin "HEAD:$TARGET_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        if: steps.upstream.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js 20
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        if: steps.upstream.outputs.changed == 'true'
        run: bun install

      - name: Traducir cadenas con Groq
        if: steps.upstream.outputs.changed == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/translate.mjs

      - name: Compilar bundle + bytecode de Hermes
        if: steps.upstream.outputs.changed == 'true'
        # --release-branch=main evita que el bundle se compile con __DEV__ = true.
        run: bun run build --release-branch=main --build-bytecode

      - name: Preparar datos del release
        if: steps.upstream.outputs.changed == 'true'
        id: meta
        run: |
          set -euo pipefail
          ls -la dist

          VERSION="$(grep -oP 'version: `"\Kv[0-9]+\.[0-9]+\.[0-9]+' scripts/build.mjs | head -n 1 || true)"
          VERSION="${VERSION:-unknown}"
          HASH="$(node -e 'try{console.log(JSON.parse(require("fs").readFileSync("dist/info.json","utf8")).hash||"")}catch{console.log("")}')"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Mover el tag 'latest' al commit compilado
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest HEAD
          git push -f origin refs/tags/latest

      - name: Publicar / actualizar release 'latest'
        if: steps.upstream.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RouxCord ${{ steps.meta.outputs.version }}
          body: |
            Build automático de RouxCord.

            - Versión: `${{ steps.meta.outputs.version }}`
            - Commit: `${{ github.sha }}`
            - SHA-256 del bundle: `${{ steps.meta.outputs.hash }}`
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: "true"
          prerelease: false
          draft: false
