name: Build RouxCord bundle

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

concurrency:
  group: roux-build-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://codeberg.org/raincord/rain.git
  UPSTREAM_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar con upstream (Codeberg)
        id: upstream
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          PROTECTED_PATHS=(
            "src/rain/pages/Updater/index.tsx"
            "src/index.ts"
            "src/global.d.ts"
            "src/lib/index.ts"
            "src/rain/i18n/index.ts"
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH"

          # Detectar si fue un cambio directo tuyo
          IS_USER_PUSH=0
          if [ "$EVENT_NAME" = "push" ]; then
            LAST_AUTHOR="$(git log -1 --pretty=format:'%an')"
            if [ "$LAST_AUTHOR" != "github-actions[bot]" ]; then
              IS_USER_PUSH=1
            fi
          fi

          if ! BASE="$(git merge-base HEAD "upstream/$UPSTREAM_BRANCH" 2>/dev/null)"; then
            echo "::error::Este repositorio no comparte historial con $UPSTREAM_URL."
            exit 1
          fi

          RAIN_HAS_NEW=0
          if ! git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            RAIN_HAS_NEW=1
          fi

          # En cron: solo compila si Rain tiene cambios
          if [ "$EVENT_NAME" = "schedule" ] && [ "$RAIN_HAS_NEW" -eq 0 ]; then
            echo "El upstream no tiene commits nuevos. No hay nada que compilar."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "is_user_push=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Si Rain tiene cambios, fusionar
          if [ "$RAIN_HAS_NEW" -eq 1 ]; then
            echo "Commits nuevos en upstream:"
            git log --oneline "HEAD..upstream/$UPSTREAM_BRANCH" | head -20

            TOUCHED="$(git diff --name-only "$BASE" "upstream/$UPSTREAM_BRANCH" -- "${PROTECTED_PATHS[@]}" || true)"
            if [ -n "$TOUCHED" ]; then
              echo "::warning::Upstream modificó archivos de rebranding: $(echo "$TOUCHED" | tr '\n' ' ')"
            fi

            if git merge --no-edit -X ours "upstream/$UPSTREAM_BRANCH"; then
              echo "Fusión limpia."
            else
              while IFS= read -r FILE; do
                [ -z "$FILE" ] && continue
                IS_PROTECTED=0
                for P in "${PROTECTED_PATHS[@]}"; do
                  if [ "$FILE" = "$P" ]; then IS_PROTECTED=1; break; fi
                done

                if [ "$IS_PROTECTED" -eq 1 ]; then
                  git checkout --ours -- "$FILE" 2>/dev/null && git add -- "$FILE" || git rm -q -- "$FILE"
                fi
              done < <(git diff --name-only --diff-filter=U)

              git commit --no-edit || true
            fi

            git push origin "HEAD:$TARGET_BRANCH"
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "is_user_push=$IS_USER_PUSH" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        if: steps.upstream.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js 20
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        if: steps.upstream.outputs.changed == 'true'
        run: bun install

      - name: Traducir cadenas con Groq
        if: steps.upstream.outputs.changed == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/translate.mjs

      - name: Compilar bundle + bytecode de Hermes
        if: steps.upstream.outputs.changed == 'true'
        run: bun run build --release-branch=main --build-bytecode

      - name: Preparar datos del release y subir nivel
        if: steps.upstream.outputs.changed == 'true'
        id: meta
        env:
          IS_USER_PUSH: ${{ steps.upstream.outputs.is_user_push }}
        run: |
          set -euo pipefail
          ls -la dist

          # 1. Base (ej: 1.0)
          BASE_VERSION="$(node -e '
            try {
              const v = require("./package.json").version || "1.0.0";
              const parts = v.replace(/^v/, "").split(".");
              console.log(`${parts[0] || "1"}.${parts[1] || "0"}`);
            } catch { console.log("1.0"); }
          ')"

          # 2. Contador de commits de Rain (+1 por cada actualización)
          RAIN_LEVEL="$(git rev-list --count "upstream/$UPSTREAM_BRANCH")"

          # 3. Sufijo según cambios propios
          SUFFIX=""
          if [ "$IS_USER_PUSH" = "1" ]; then
            MSG="$(git log -1 --pretty=format:'%s' | tr '[:upper:]' '[:lower:]')"
            if [[ "$MSG" =~ (feat|add|new|nuevo) ]]; then
              SUFFIX="-new"
            else
              SUFFIX="-fix"
            fi
          fi

          VERSION="v${BASE_VERSION}.${RAIN_LEVEL}${SUFFIX}"
          HASH="$(node -e 'try{console.log(JSON.parse(require("fs").readFileSync("dist/info.json","utf8")).hash||"")}catch{console.log("")}')"
          CURRENT_COMMIT="$(git rev-parse --short HEAD)"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "commit=$CURRENT_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Mover el tag 'latest' al commit compilado
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest HEAD
          git push -f origin refs/tags/latest

      - name: Publicar / actualizar release 'latest'
        if: steps.upstream.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RouxCord ${{ steps.meta.outputs.version }}
          body: |
            Build automático de RouxCord.

            - **Versión:** `${{ steps.meta.outputs.version }}`
            - **Commit:** `${{ steps.meta.outputs.commit }}`
            - **SHA-256 del bundle:** `${{ steps.meta.outputs.hash }}`
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: "true"
          prerelease: false
          draft: false
