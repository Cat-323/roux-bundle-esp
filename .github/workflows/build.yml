name: Build RouxCord bundle

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

concurrency:
  group: roux-build-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://codeberg.org/raincord/rain.git
  UPSTREAM_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar con upstream (Codeberg)
        id: upstream
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          PROTECTED_PATHS=(
            "src/rain/pages/Updater/index.tsx"
            "src/index.ts"
            "src/global.d.ts"
            "src/lib/index.ts"
            "src/rain/i18n/index.ts"
            "package.json"
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH"

          if ! BASE="$(git merge-base HEAD "upstream/$UPSTREAM_BRANCH" 2>/dev/null)"; then
            echo "::error::Este repositorio no comparte historial con $UPSTREAM_URL."
            exit 1
          fi

          RAIN_HAS_NEW=0
          if ! git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            RAIN_HAS_NEW=1
          fi

          if [ "$EVENT_NAME" = "schedule" ] && [ "$RAIN_HAS_NEW" -eq 0 ]; then
            echo "El upstream no tiene commits nuevos. No hay nada que compilar."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$RAIN_HAS_NEW" -eq 1 ]; then
            echo "Commits nuevos en upstream:"
            git log --oneline "HEAD..upstream/$UPSTREAM_BRANCH" | head -20

            TOUCHED="$(git diff --name-only "$BASE" "upstream/$UPSTREAM_BRANCH" -- "${PROTECTED_PATHS[@]}" || true)"
            if [ -n "$TOUCHED" ]; then
              echo "::warning::Upstream modificó archivos de rebranding: $(echo "$TOUCHED" | tr '\n' ' ')"
            fi

            if git merge --no-edit -X ours "upstream/$UPSTREAM_BRANCH"; then
              echo "Fusión limpia."
            else
              while IFS= read -r FILE; do
                [ -z "$FILE" ] && continue
                IS_PROTECTED=0
                for P in "${PROTECTED_PATHS[@]}"; do
                  if [ "$FILE" = "$P" ]; then IS_PROTECTED=1; break; fi
                done

                if [ "$IS_PROTECTED" -eq 1 ]; then
                  git checkout --ours -- "$FILE" 2>/dev/null && git add -- "$FILE" || git rm -q -- "$FILE"
                fi
              done < <(git diff --name-only --diff-filter=U)

              git commit --no-edit || true
            fi

            git push origin "HEAD:$TARGET_BRANCH"
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        if: steps.upstream.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js 20
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        if: steps.upstream.outputs.changed == 'true'
        run: bun install

      - name: Traducir cadenas con Groq
        if: steps.upstream.outputs.changed == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/translate.mjs || true

      - name: Incrementar versión y guardar en repositorio
        if: steps.upstream.outputs.changed == 'true'
        id: meta
        run: |
          set -euo pipefail
          rm -rf dist

          NEXT_RAW=$(node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            
            let v = (pkg.version || "1.0.1").replace(/^v/, "").trim();
            let [major, minor, patch] = v.split(".").map(n => parseInt(n, 10));

            if (isNaN(major)) major = 1;
            if (isNaN(minor)) minor = 0;
            if (isNaN(patch)) patch = 1;

            if (patch >= 9) {
              patch = 0;
              if (minor >= 9) {
                major += 1;
                minor = 0;
              } else {
                minor += 1;
              }
            } else {
              patch += 1;
            }

            const nextVersion = `${major}.${minor}.${patch}`;
            pkg.version = nextVersion;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            process.stdout.write(nextVersion);
          ')

          VERSION="v${NEXT_RAW}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): bump version to ${VERSION} [skip ci]" || true
          git push origin "HEAD:${{ github.ref_name }}"

          CURRENT_COMMIT="$(git rev-parse --short HEAD)"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$CURRENT_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Compilar bundle + bytecode de Hermes
        if: steps.upstream.outputs.changed == 'true'
        run: bun run build --release-branch=main --build-bytecode

      - name: Inyectar paths y version en info.json
        if: steps.upstream.outputs.changed == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const infoPath = "dist/info.json";
            let info = {};
            if (fs.existsSync(infoPath)) {
              info = JSON.parse(fs.readFileSync(infoPath, "utf8"));
            }
            info.paths = fs.readdirSync("dist");
            info.version = "${{ steps.meta.outputs.version }}".replace(/^v/, "").trim();
            fs.writeFileSync(infoPath, JSON.stringify(info, null, 2));
            console.log("dist/info.json generado para el loader:\n", JSON.stringify(info, null, 2));
          '

      - name: Obtener hash del bundle
        if: steps.upstream.outputs.changed == 'true'
        id: bundle_meta
        run: |
          set -euo pipefail
          ls -la dist
          HASH="$(node -e 'try{console.log(JSON.parse(require("fs").readFileSync("dist/info.json","utf8")).hash||"")}catch{console.log("")}')"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Purgar release y tag 'latest' anteriores
        if: steps.upstream.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true

      - name: Crear tag 'latest' limpio
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest HEAD
          git push origin refs/tags/latest -f

      - name: Publicar release 'latest'
        if: steps.upstream.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RouxCord ${{ steps.meta.outputs.version }}
          body: |
            Build automático de RouxCord.

            - **Versión:** `${{ steps.meta.outputs.version }}`
            - **Commit:** `${{ steps.meta.outputs.commit }}`
            - **SHA-256 del bundle:** `${{ steps.bundle_meta.outputs.hash }}`
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: "true"
          prerelease: false
          draft: false
